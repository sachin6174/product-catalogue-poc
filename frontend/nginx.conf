server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser calls /api, nginx forwards it to the backend.
  # This means no CORS setup and the backend isn't exposed to the host at all.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routing: unknown paths (e.g. /products/3) load the React app.
  location / {
    try_files $uri /index.html;
  }
}
